name: Test, build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # every 6 hours: refresh the catalog
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fetch-catalog
        env:
          CATALOG_FALLBACK_URL: https://oliviersci.github.io/orbit-lab/data/catalog.json
      - run: npm run fetch-orbiters
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4